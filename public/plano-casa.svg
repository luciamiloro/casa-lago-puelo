<svg xmlns="http://www.w3.org/2000/svg" viewBox="172 112 1000 712" width="1000" height="712">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#efe6d8"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b9a58d" stroke-width="1.6"/>
    </pattern>
    <style>
      .floor { fill: #fbf7f1; stroke: #fbf7f1; stroke-width: 0.8; }
      .wall { fill: #3d2c22; }
      .win { fill: #fbf7f1; stroke: #3d2c22; stroke-width: 1.4; }
      .lbl { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; letter-spacing: 1.6px; fill: #6b5444; text-anchor: middle; }
      .lbl-s { font-size: 10.5px; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- fondo -->
  <rect x="172" y="112" width="1000" height="712" fill="#f4ede3"/>

  <!-- galería -->
  <rect x="668" y="690" width="437" height="122" fill="#ece2d3" stroke="#b9a58d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g class="wall">
    <rect x="655" y="806" width="14" height="14"/>
    <rect x="800" y="806" width="14" height="14"/>
    <rect x="945" y="806" width="14" height="14"/>
    <rect x="1091" y="806" width="14" height="14"/>
  </g>

  <!-- masa de muros (silueta de la casa) -->
  <polygon class="wall" points="228,175 1105,175 1105,690 660,690 660,745 228,745"/>

  <!-- ambientes (pisos) -->
  <g class="floor">
    <rect x="240" y="187" width="236" height="216"/>   <!-- dormitorio 1 -->
    <rect x="520" y="187" width="138" height="143"/>   <!-- dormitorio servicio -->
    <rect x="520" y="337" width="68" height="118"/>    <!-- baño servicio -->
    <rect x="595" y="337" width="63" height="118"/>    <!-- toilette -->
    <rect x="665" y="187" width="193" height="268"/>   <!-- cocina -->
    <rect x="865" y="187" width="228" height="283"/>   <!-- comedor -->
    <rect x="767" y="462" width="326" height="216"/>   <!-- sala de estar -->
    <rect x="240" y="412" width="138" height="100"/>   <!-- baño -->
    <rect x="386" y="410" width="90" height="105"/>    <!-- palier -->
    <rect x="386" y="462" width="381" height="53"/>    <!-- pasillo -->
    <rect x="667" y="515" width="100" height="163"/>   <!-- vestíbulo -->
    <rect x="240" y="522" width="190" height="211"/>   <!-- dormitorio 2 -->
    <rect x="437" y="522" width="176" height="211"/>   <!-- dormitorio 3 -->
  </g>

  <!-- placards -->
  <rect x="483" y="187" width="30" height="133" fill="url(#hatch)"/>
  <rect x="483" y="327" width="30" height="128" fill="url(#hatch)"/>
  <rect x="240" y="522" width="140" height="30" fill="url(#hatch)"/>
  <rect x="620" y="522" width="33" height="211" fill="url(#hatch)"/>

  <!-- despensa y muros interiores extra -->
  <rect class="wall" x="783" y="393" width="75" height="7"/>
  <rect class="wall" x="783" y="393" width="7" height="62"/>
  <rect class="wall" x="760" y="630" width="7" height="48"/>


  <!-- escalera al sótano -->
  <g><line x1="800" y1="402" x2="800" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="807" y1="402" x2="807" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="814" y1="402" x2="814" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="821" y1="402" x2="821" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="828" y1="402" x2="828" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="835" y1="402" x2="835" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="842" y1="402" x2="842" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="849" y1="402" x2="849" y2="453" stroke="#b9a58d" stroke-width="1.2"/><line x1="856" y1="402" x2="856" y2="453" stroke="#b9a58d" stroke-width="1.2"/>
    <line x1="796" y1="428" x2="850" y2="428" stroke="#3d2c22" stroke-width="1.3"/>
    <polygon points="850,424 856,428 850,432" fill="#3d2c22"/>
  </g>
  <!-- aberturas interiores (puertas) -->
  <g class="floor">
    <rect x="420" y="402" width="46" height="9"/>   <!-- dorm 1 -->
    <rect x="377" y="470" width="10" height="38"/>  <!-- baño -->
    <rect x="392" y="514" width="34" height="9"/>   <!-- dorm 2 -->
    <rect x="445" y="514" width="38" height="9"/>   <!-- dorm 3 -->
    <rect x="530" y="329" width="46" height="9"/>   <!-- lavadero -> dorm servicio -->
    <rect x="605" y="454" width="42" height="9"/>   <!-- toilette -->
    <rect x="657" y="275" width="9" height="42"/>   <!-- servicio-cocina -->
    <rect x="680" y="454" width="60" height="9"/>   <!-- cocina-pasillo -->
    <rect x="857" y="222" width="9" height="48"/>   <!-- cocina-comedor -->
    <rect x="782" y="408" width="9" height="38"/>  <!-- acceso escalera -->
    <rect x="675" y="677" width="46" height="14"/>  <!-- entrada -->
  </g>

  <!-- ventanas -->
  <g>
    <rect class="win" x="228" y="250" width="12" height="80"/>
    <rect class="win" x="300" y="175" width="100" height="12"/>
    <rect class="win" x="555" y="175" width="70" height="12"/>
    <rect class="win" x="700" y="175" width="100" height="12"/>
    <rect class="win" x="930" y="175" width="110" height="12"/>
    <rect class="win" x="1093" y="250" width="12" height="100"/>
    <rect class="win" x="228" y="440" width="12" height="45"/>
    <rect class="win" x="228" y="600" width="12" height="80"/>
    <rect class="win" x="280" y="733" width="110" height="12"/>
    <rect class="win" x="470" y="733" width="110" height="12"/>
    <rect class="win" x="790" y="678" width="120" height="12"/>
    <rect class="win" x="960" y="678" width="100" height="12"/>
  </g>

  <!-- hogar -->
  <rect class="wall" x="1080" y="565" width="34" height="75"/>
  <rect x="1082" y="585" width="11" height="35" fill="#8a6a55"/>

  <!-- nombres de ambientes (debajo del punto) -->
  <g class="lbl">
    <text x="352" y="297">DORMITORIO 1</text>
    <text x="589" y="254" class="lbl-s">DORM. SERVICIO</text>
    <text x="554" y="385" class="lbl-s" style="font-size:8.5px;letter-spacing:0.4px">LAVADERO</text>
    <text x="626" y="385" class="lbl-s" style="font-size:9px;letter-spacing:0.6px">TOIL.</text>
    <text x="752" y="311">COCINA</text>
    <text x="982" y="311">COMEDOR</text>
    <text x="300" y="478" class="lbl-s">BAÑO</text>
    <text x="342" y="688">DORMITORIO 2</text>
    <text x="525" y="688">DORMITORIO 3</text>
    <text x="715" y="646" class="lbl-s">VESTÍBULO</text>
    <text x="932" y="610">SALA DE ESTAR</text>
    <text x="902" y="795">GALERÍA</text>
    <text x="821" y="386" class="lbl-s" style="font-size:8px;letter-spacing:0.5px">↓ SÓTANO</text>
  </g>

  <text x="232" y="790" class="lbl" style="text-anchor:start;font-size:15px;letter-spacing:4px;fill:#3d2c22">PLANTA</text>
  <text x="232" y="808" class="lbl" style="text-anchor:start;font-size:10px;fill:#8a7462">Esquema ilustrativo · medidas aproximadas</text>
</svg>
